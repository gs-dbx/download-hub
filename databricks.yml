# Databricks Asset Bundle — Data Download Hub (a configurable gold-view download
# app with per-report filters). Set the variables + workspace.host below to your
# environment (or override per target / via -p <profile>) before deploying.
bundle:
  name: download_hub

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog holding the report_config registry + report/audit tables
    default: irs_synthetic
  schema:
    description: Schema holding the report_config registry + report/audit tables
    default: download_hub
  warehouse_id:
    description: Serverless SQL warehouse the app queries through (set to your id)
    default: "2f225c0740dcd22b"
  app_users_group:
    description: Databricks group for basic app access (also the seeded collection key)
    default: download_hub_app_users
  download_users_group:
    description: Databricks group for the gated download entitlement
    default: download_hub_download_users
  collection_admin_group:
    description: Delegated per-collection admin group seeded onto the sample collection
    default: download_hub_operations_admins

workspace:
  # IRS GovCloud demo workspace. Auth via the `field-eng-aws-gov-demo-irs-demo`
  # CLI profile (or set per target / via -p <profile>).
  host: https://field-eng-aws-gov-demo-irs-demo.cloud.databricks.us

targets:
  dev:
    default: true
    mode: development
  staging:
    mode: development
  prod:
    mode: production

# resources:  (added incrementally by phases)
#   Phase 1 → schema + tables + synthetic-data job
#   Phase 2 → apps.download-hub (FastAPI) + sql-warehouse resource binding
