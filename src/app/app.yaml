command:
  - "uvicorn"
  - "main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Serverless SQL warehouse the app queries through — set to your warehouse id.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "2f225c0740dcd22b"
  # Unity Catalog location of the report_config registry + report/audit tables.
  - name: APP_CATALOG
    value: "irs_synthetic"
  - name: APP_SCHEMA
    value: "download_hub"
  # Branding — white-label by config alone, no code change. APP_LOGO is a local
  # /static path (kept local for the air-gap guarantee). APP_ORG_NAME is the logo
  # alt text; it defaults to APP_NAME when unset.
  - name: APP_NAME
    value: "Data Download Hub"
  - name: APP_ORG_NAME
    value: "Data Download Hub"
  - name: APP_LOGO
    value: "/static/img/logo.svg"
  - name: APP_VERSION
    value: "0.12.1"
  # Workspace groups used for the admin console. ADMIN_GROUP is retained for
  # backward compatibility; SYSTEM_ADMIN_GROUP is the app-wide (system) admin tier
  # — members administer EVERY resource collection and the collection->admin-group
  # mapping. Per-collection (delegated) admins are named by each collection's
  # report_view.admin_group (edited in the console). There is no separate download
  # group: every user who can access a resource may also download it.
  - name: ADMIN_GROUP
    value: "download_hub_system_admins"
  - name: SYSTEM_ADMIN_GROUP
    value: "download_hub_system_admins"
  # Global download kill switch: false/0/no/off disables downloads everywhere.
  - name: DOWNLOADS_ENABLED
    value: "true"
  # Over-cap exports: when set to a "/Volumes/<catalog>/<schema>/<volume>" root,
  # exports larger than the direct row cap are written there by the app service
  # principal and retrieved through the app instead of a 413. End users should
  # NOT receive direct access. Leave empty to keep the hard 413 for over-cap exports.
  - name: APP_EXPORT_VOLUME
    value: "/Volumes/irs_synthetic/download_hub/download_exports"
  # Large CSV exports are queried and written in bounded pages.
  - name: EXPORT_PAGE_ROWS
    value: "10000"
  # Async downloads: every download is queued and generated in the background to
  # APP_EXPORT_VOLUME, then tracked on the "My downloads" page. This caps how many
  # generations run at once (the rest wait as "queued").
  - name: EXPORT_CONCURRENCY
    value: "2"
  # Performance: cap each filter dropdown's DISTINCT scan so a filter over a very
  # large source can't trigger an unbounded full-table scan on every page load.
  - name: MAX_FILTER_OPTIONS
    value: "500"
  # Server-side per-session query cache TTL (seconds). Page results + filter
  # options are cached per user; the Refresh button always bypasses/evicts.
  - name: SESSION_CACHE_TTL_SECONDS
    value: "45"
  # Acknowledgement text shown in the download modal AND embedded atop every
  # export. Leave unset to use the generic built-in default (exports.py). Set a
  # multi-line block scalar here to supply your org's data-handling notice, e.g.:
  #   - name: DOWNLOAD_DISCLAIMER
  #     value: |
  #       DATA HANDLING NOTICE.
  #       By downloading you acknowledge ...
