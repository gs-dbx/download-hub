# requirements.lock — full transitive closure for the Data Download Hub app.
#
# This is the OFFLINE MIRROR SOURCE: `scripts/build_wheelhouse.sh` reads it to
# download every wheel the app needs into `wheelhouse/`, which ops then installs
# with `pip install --no-index --find-links wheelhouse -r requirements.lock` on
# the air-gapped target (linux manylinux2014_x86_64, CPython 3.11 — matches the
# Databricks Apps runtime).
#
# Regenerate from a clean virtualenv:
#   python -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -r src/app/requirements.txt
#   /tmp/lockenv/bin/pip freeze > requirements.lock   # then re-add this header
#
# Direct dependencies are pinned in src/app/requirements.txt; the rest are the
# resolved transitive closure captured from the app build.

