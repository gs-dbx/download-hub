resources:
  jobs:
    metrics_seed:
      name: "[${bundle.target}] download_hub — daily metrics seed"
      tasks:
        - task_key: generate
          notebook_task:
            notebook_path: ../src/notebooks/generate_daily_metrics.py   # relative to resources/
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              view_group: ${var.app_users_group}
              download_group: ${var.download_users_group}
